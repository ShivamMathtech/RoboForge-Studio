services:
  backend:
    build: ./backend
    environment:
      API_CORS_ORIGINS: http://localhost:5173
      SIMULATION_TIMESTEP: 0.01
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

